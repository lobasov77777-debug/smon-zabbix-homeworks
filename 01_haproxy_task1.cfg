global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 50s
    timeout server 50s

frontend tcp_front
    bind :1325
    default_backend python_servers

backend python_servers
    mode tcp
    balance roundrobin
    server s1 127.0.0.1:8888 check inter 2s
    server s2 127.0.0.1:9999 check inter 2s
