global_defs {
    router_id KA_NODE3
    script_user root
    enable_script_security
}

vrrp_script check_web {
    script "/usr/local/bin/check_web.sh"
    interval 3
    timeout 2
    fall 1
    rise 1
    weight 0
}

vrrp_track_file load_priority {
    file /var/lib/keepalived/load_priority
    weight 1
}

vrrp_instance VI_1 {
    state BACKUP
    interface enp0s8
    virtual_router_id 15
    priority 200
    advert_int 1
    virtual_ipaddress {
        192.168.56.45/24
    }
    track_script {
        check_web
    }
    track_file {
        load_priority
    }
}
