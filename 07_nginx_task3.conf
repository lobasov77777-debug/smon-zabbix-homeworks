log_format cluster_hw '$request_uri status=$status upstream=$upstream_addr';

server {
    listen 8080;
    server_name example.local;
    root /var/www;

    access_log /var/log/nginx/cluster-hw.log cluster_hw;

    location ~* \.jpg$ {
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
