global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 50s
    timeout server 50s

frontend virtual_hosts
    bind :8088
    acl site1 hdr(host),field(1,:) -i example1.local
    acl site2 hdr(host),field(1,:) -i example2.local
    http-request deny if !site1 !site2
    use_backend example1_servers if site1
    use_backend example2_servers if site2

backend example1_servers
    mode http
    balance roundrobin
    server s1 127.0.0.1:8888 check inter 2s
    server s2 127.0.0.1:9999 check inter 2s

backend example2_servers
    mode http
    balance roundrobin
    server s3 127.0.0.1:10000 check inter 2s
    server s4 127.0.0.1:10001 check inter 2s
